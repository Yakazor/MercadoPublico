name: Detalle Compra Ágil

# Detalle de una Compra Ágil por código (productos, monto, entrega, si calza con tus
# rubros). Actions → "Detalle Compra Ágil" → Run workflow → código(s). El resultado
# queda en el resumen de la corrida y como artefacto JSON.
on:
  workflow_dispatch:
    inputs:
      codigos:
        description: "Código(s) separados por espacio, p. ej. 1080936-111-COT26"
        required: true

jobs:
  detalle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pedir detalle
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          MP_TICKET_COMPRA_AGIL: ${{ secrets.MP_TICKET_COMPRA_AGIL }}
          CODIGOS: ${{ inputs.codigos }}
        run: |
          set -o pipefail
          # Solo caracteres de un código de Mercado Público (nada que el shell interprete).
          CODIGOS=$(echo "$CODIGOS" | tr -cd 'A-Za-z0-9 -')
          python scripts/detalle_compra_agil.py $CODIGOS --json detalle.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: detalle-compra-agil-${{ github.run_number }}
          path: detalle.json
          retention-days: 14
          if-no-files-found: ignore
