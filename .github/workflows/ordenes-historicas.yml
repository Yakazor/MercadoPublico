name: Órdenes de compra históricas

# Descarga OC de mis rubros para estimar precios adjudicados (validar márgenes).
# - Manual: Actions → "Órdenes de compra históricas" → Run workflow.
# - Semanal: sábados 9:11 UTC procesa los últimos 7 días (los ya procesados se omiten).
on:
  schedule:
    - cron: "11 9 * * 6"
  workflow_dispatch:
    inputs:
      dias:
        description: "Últimos N días (se ignora si indicas 'desde')"
        required: false
        default: "7"
      desde:
        description: "Desde (AAAA-MM-DD), opcional"
        required: false
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD), opcional; por defecto ayer"
        required: false
        default: ""
      reprocesar:
        description: "Volver a descargar días ya procesados"
        type: boolean
        default: false

# Mismo grupo que el radar diario: comparten la base SQLite en caché y no
# deben correr al mismo tiempo.
concurrency:
  group: radar-db
  cancel-in-progress: false

jobs:
  ordenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaurar base de datos
        uses: actions/cache/restore@v5
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Descargar órdenes de compra
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          DIAS: ${{ inputs.dias || '7' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          REPROCESAR: ${{ inputs.reprocesar }}
        run: |
          if [ -n "$DESDE" ]; then
            ARGS="--desde $DESDE"
            [ -n "$HASTA" ] && ARGS="$ARGS --hasta $HASTA"
          else
            ARGS="--dias $DIAS"
          fi
          [ "$REPROCESAR" = "true" ] && ARGS="$ARGS --reprocesar"
          python scripts/ordenes_historicas.py $ARGS

      - name: Guardar base de datos
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}

      - name: Resumen
        if: always()
        run: python scripts/resumen_oc.py >> "$GITHUB_STEP_SUMMARY"

      - name: Precios por producto (listado para revisar)
        if: always()
        run: python scripts/resumen_oc.py --texto --top 25

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oc-${{ github.run_number }}
          path: data/exportaciones/oc_*
          retention-days: 30
          if-no-files-found: ignore
