name: Radar diario de licitaciones

# Lunes a viernes 11:07 UTC = 8:07 en Chile (horario de verano) / 7:07 (invierno).
# También se puede lanzar a mano: Actions → "Radar diario de licitaciones" → Run workflow.
on:
  schedule:
    - cron: "7 11 * * 1-5"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de detalles a consultar (vacío = todos)"
        required: false
        default: ""
      solo_exportar:
        description: "No llamar a la API: solo re-exportar la base guardada"
        type: boolean
        default: false

concurrency:
  group: radar-db
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Recupera la base SQLite de la ejecución anterior (historial y primera detección).
      # La base vive en la caché. Claves "v1" = base con historial; "v0" = base
      # que partió vacía (caché no encontrada). Se prefiere siempre una v1, así
      # una falla puntual de la caché no reemplaza el historial por una base vacía.
      - name: Restaurar base de datos
        id: restaurar
        uses: actions/cache/restore@v5
        with:
          path: data/radar.db
          key: radar-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-db-v1-
            radar-db-v0-
            radar-db-

      - name: Aviso si no había base guardada
        if: steps.restaurar.outputs.cache-matched-key == ''
        run: |
          echo "::warning::No se encontró la base guardada; esta corrida parte con una base vacía (se guarda como v0, sin reemplazar una base con historial)."
          echo "> ⚠️ No se encontró la base guardada: esta corrida partió con una base vacía. Puedes recuperar una copia desde el artefacto radar-db-* de una corrida anterior." >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar radar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          LIMITE: ${{ inputs.limite }}
          SOLO_EXPORTAR: ${{ inputs.solo_exportar }}
        run: |
          ARGS=""
          [ -n "$LIMITE" ] && ARGS="--limite $LIMITE"
          [ "$SOLO_EXPORTAR" = "true" ] && ARGS="--solo-exportar"
          python scripts/radar_diario.py $ARGS

      - name: Guardar base de datos
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/radar.db
          key: radar-db-${{ steps.restaurar.outputs.cache-matched-key != '' && 'v1' || 'v0' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Respaldo de la base (artefacto, 90 días)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: radar-db-${{ github.run_number }}-${{ github.run_attempt }}
          path: data/radar.db
          retention-days: 90
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        run: python scripts/resumen_md.py >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoría del filtro (listado completo)
        if: always()
        run: python scripts/resumen_md.py --auditoria

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: radar-${{ github.run_number }}
          path: data/exportaciones/
          retention-days: 30
          if-no-files-found: ignore
