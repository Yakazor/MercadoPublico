name: Radar diario de licitaciones

# Lunes a viernes 11:07 UTC = 8:07 en Chile (horario de verano) / 7:07 (invierno).
# También se puede lanzar a mano: Actions → "Radar diario de licitaciones" → Run workflow.
on:
  schedule:
    - cron: "7 11 * * 1-5"
  # "Actualizar ahora" (botón del dashboard / rutina de Claude): un push que solo
  # cambia .github/disparar/actualizar.txt lanza la corrida sin la API de GitHub.
  push:
    branches: [feature/api-mercadopublico]
    paths: [".github/disparar/actualizar.txt"]
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de detalles a consultar (vacío = todos)"
        required: false
        default: ""
      solo_exportar:
        description: "No llamar a la API: solo re-exportar la base guardada"
        type: boolean
        default: false

concurrency:
  group: radar-db
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # publica los JSON del dashboard en la rama "datos"
      actions: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Recupera la base SQLite de la ejecución anterior (historial y primera detección).
      # La base vive en la caché. Claves "v1" = base con historial; "v0" = base
      # que partió vacía (caché no encontrada). Se prefiere siempre una v1, así
      # una falla puntual de la caché no reemplaza el historial por una base vacía.
      - name: Restaurar base de datos
        id: restaurar
        uses: actions/cache/restore@v5
        with:
          path: data/radar.db
          key: radar-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-db-v1-
            radar-db-v0-
            radar-db-

      # Sin caché (expiró tras 7 días sin uso, cambió la rama por defecto…): se
      # recupera el respaldo más reciente guardado como artefacto.
      - name: Recuperar base desde el último respaldo
        id: respaldo
        if: steps.restaurar.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo respaldos con historial (v1). Solo la rama principal los sube, así
          # que sirven aunque la rama principal haya cambiado de nombre.
          id=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"radar-db-v1-\")) | select(.expired | not)
                  | [.created_at, .id] | @tsv" \
            | sort | tail -n 1 | cut -f2)
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/radar-db.zip
            mkdir -p data && unzip -o -q /tmp/radar-db.zip -d data
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Base recuperada desde el artefacto $id"
          fi

      # Una re-ejecución de una corrida antigua usa código y config.yaml antiguos:
      # puede correr, pero no reemplaza la base compartida.
      - name: Verificar que el código es la última versión de la rama
        id: version
        # Si solo cambiaron archivos que no afectan los datos (README, workflows),
        # se guarda igual: no se pierde una corrida larga por un cambio menor.
        # Solo la rama principal guarda la base (las ramas de prueba no la pisan).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si GitHub no responde, la corrida sigue, pero sin guardar la base.
          principal=$(gh api "repos/${{ github.repository }}" --jq .default_branch) || principal=""
          actual=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1) || actual=""
          if [ -z "$principal" ] || [ -z "$actual" ]; then
            echo "es_actual=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se pudo consultar la rama en GitHub; esta corrida no guardará la base."
          elif [ "$GITHUB_REF_NAME" != "$principal" ]; then
            echo "es_actual=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rama '$GITHUB_REF_NAME' no es la principal ('$principal'): la base no se guardará."
          elif [ "$actual" = "$GITHUB_SHA" ]; then
            echo "es_actual=true" >> "$GITHUB_OUTPUT"
          elif git fetch -q --depth=1 origin "$actual" \
               && git diff --quiet "$GITHUB_SHA" "$actual" -- src scripts config.yaml requirements.txt; then
            echo "es_actual=true" >> "$GITHUB_OUTPUT"
            echo "La rama avanzó, pero sin cambios en src/, scripts/ ni config.yaml."
          else
            echo "es_actual=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Esta corrida usa código o config.yaml antiguos ($GITHUB_SHA); no se guardará la base."
          fi

      - name: Aviso si no había base guardada
        if: steps.restaurar.outputs.cache-matched-key == '' && steps.respaldo.outputs.ok != 'true'
        run: |
          echo "::warning::No se encontró la base guardada; esta corrida parte con una base vacía (se guarda como v0, sin reemplazar una base con historial)."
          echo "> ⚠️ No se encontró la base guardada: esta corrida partió con una base vacía. Puedes recuperar una copia desde el artefacto radar-db-* de una corrida anterior." >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar radar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          LIMITE: ${{ inputs.limite }}
          SOLO_EXPORTAR: ${{ inputs.solo_exportar }}
        run: |
          ARGS=""
          [ -n "$LIMITE" ] && ARGS="--limite $LIMITE"
          [ "$SOLO_EXPORTAR" = "true" ] && ARGS="--solo-exportar"
          # Deja ~20 min de margen antes del timeout para guardar la base.
          python scripts/radar_diario.py $ARGS --max-minutos 95

      - name: Guardar base de datos
        if: always() && steps.version.outputs.es_actual == 'true'
        uses: actions/cache/save@v5
        with:
          path: data/radar.db
          key: radar-db-${{ (steps.restaurar.outputs.cache-matched-key != '' || steps.respaldo.outputs.ok == 'true') && 'v1' || 'v0' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Respaldo de la base (artefacto, 30 días)
        if: always() && steps.version.outputs.es_actual == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: radar-db-${{ (steps.restaurar.outputs.cache-matched-key != '' || steps.respaldo.outputs.ok == 'true') && 'v1' || 'v0' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: data/radar.db
          retention-days: 30
          if-no-files-found: ignore

      # Datos en JSON para el dashboard, en la rama "datos" del repositorio (un solo
      # commit que se reemplaza en cada corrida). Solo con una base con historial.
      - name: Publicar datos para el dashboard
        if: success() && steps.version.outputs.es_actual == 'true' && (steps.restaurar.outputs.cache-matched-key != '' || steps.respaldo.outputs.ok == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publicar_datos.py --salida "$RUNNER_TEMP/datos"
          # Presupuestos con los precios de mercado guardados en informes/mercado/ y
          # la referencia OC del día (mercado.json alimenta el simulador del dashboard).
          python scripts/presupuesto.py --items "$RUNNER_TEMP/datos/items.json" \
            --licitaciones "$RUNNER_TEMP/datos/licitaciones.json" \
            --salida "$RUNNER_TEMP/datos/presupuestos" --indice "$RUNNER_TEMP/datos/presupuestos/README.md" \
            --mercado-json "$RUNNER_TEMP/datos/mercado.json"
          cd "$RUNNER_TEMP/datos"
          git init -q -b datos
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Datos del radar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/datos

      - name: Resumen
        if: always()
        run: python scripts/resumen_md.py >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoría del filtro (listado completo)
        if: always()
        run: python scripts/resumen_md.py --auditoria

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: radar-${{ github.run_number }}
          path: data/exportaciones/
          retention-days: 30
          if-no-files-found: ignore
