name: Radar diario de licitaciones

# Lunes a viernes 11:07 UTC = 8:07 en Chile (horario de verano) / 7:07 (invierno).
# También se puede lanzar a mano: Actions → "Radar diario de licitaciones" → Run workflow.
on:
  schedule:
    - cron: "7 11 * * 1-5"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de detalles a consultar (vacío = todos)"
        required: false
        default: ""

concurrency:
  group: radar-diario
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Recupera la base SQLite de la ejecución anterior (historial y primera detección).
      - name: Restaurar base de datos
        uses: actions/cache/restore@v5
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Ejecutar radar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          LIMITE: ${{ inputs.limite }}
        run: |
          ARGS=""
          [ -n "$LIMITE" ] && ARGS="--limite $LIMITE"
          python scripts/radar_diario.py $ARGS

      - name: Guardar base de datos
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}

      - name: Resumen
        if: always()
        run: python scripts/resumen_md.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: radar-${{ github.run_number }}
          path: data/exportaciones/
          retention-days: 30
          if-no-files-found: ignore
