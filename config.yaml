# Configuración del Radar de Licitaciones

api:
  base_url: "https://api.mercadopublico.cl/servicios/v1/publico"
  timeout_segundos: 30
  pausa_entre_llamadas_segundos: 2.0   # respeta el límite de la API
  reintentos: 4                        # esperas crecientes: 2, 4, 8, 16 s
  espera_inicial_reintento_segundos: 2

# Rubros a detectar. Cómo se comparan las frases:
#   - sin tildes, mayúsculas ni puntuación ("SERV.ASEO" = "serv aseo");
#   - cada palabra admite plural ("guante" = "guantes"): basta escribir una forma;
#   - entre palabras se admiten conectores ("productos de aseo" = "productos aseo"
#     = "productos para el aseo");
#   - siempre por palabra completa ("aseo" no coincide con "paseo").
#
#   palabras_clave:      cuenta como detección si aparece en el NOMBRE o en los ÍTEMS
#                        (y en la descripción general si detectar_en_descripcion: true;
#                        en la categoría ONU de los ítems si usar_clasificacion_onu: true).
#   palabras_debiles:    claves que cuentan en el NOMBRE, pero en los ítems solo junto
#                        a otra clave (también son nombres de unidades o frases de informes).
#   no_rescatan:         claves genéricas ("guantes") que no anulan una exclusión
#                        "salvo clave específica" (p. ej. "epp").
#   palabras_candidatas: frases amplias que, en el NOMBRE, hacen que se revise el
#                        detalle; por sí solas NO cuentan como detección (en rubros sin
#                        detectar_en_descripcion, la descripción cuenta si trae 2+ claves).
#   excluir_en_nombre:   descarta SIEMPRE si aparece en el nombre (servicios, obras).
#   excluir_en_nombre_salvo_clave: descarta si aparece en el nombre, SALVO que el
#                        nombre traiga otra palabra clave fuera de la frase excluida:
#                        "Mascarilla laríngea desechable" → se descarta;
#                        "Mascarillas laríngeas, guantes y gasas" → se revisa por guantes.
#                        Una palabra clave dentro de la frase excluida no cuenta.
#   excluir_en_nombre_salvo_clave_especifica: igual, pero las claves de `no_rescatan`
#                        no bastan: "EPP: guantes y lentes" → se descarta.
#   (Las exclusiones también se revisan en cada ítem.)
#   ignorar:             frases que se borran antes de evaluar (nombres de unidades
#                        compradoras). Los nombres de unidad seguidos de una palabra
#                        clave ("Departamento de Control de Gestión") se ignoran solos.
# En las órdenes de compra se clasifica CADA ÍTEM por su producto/categoría: solo
# se guardan (y entran al cálculo de precios) los ítems de tus rubros.
rubros:
  insumos_medicos_aseo:
    nombre: "Insumos médicos no regulados y aseo"
    detectar_en_descripcion: true
    palabras_clave:
      # Insumos médicos de uso general
      - insumos medicos
      - guantes
      - guantes de nitrilo
      - guantes de latex
      - guantes de procedimiento
      - mascarillas
      - respiradores desechables
      - respirador n95
      - respirador n 95
      - respirador kn95
      - respirador kn 95
      - respirador ffp2
      - respirador ffp 2
      - pecheras
      - cofias
      - jeringas
      - gasas
      - apositos
      - alcohol gel
      - clorogel
      - gel hidroalcoholico
      - gel hidro alcoholico
      - gel alcoholico
      - solucion hidroalcoholica
      - toallas desinfectantes
      # Productos de aseo (frases, no la palabra "aseo" sola)
      - articulos de aseo
      - art de aseo
      - materiales de aseo
      - productos de aseo
      - insumos de aseo
      - equipos de aseo
      - utiles de aseo
      - productos de limpieza
      - articulos de limpieza
      - insumos de limpieza
      - materiales de limpieza
      - toallas de papel
      - papel higienico
      - jabon liquido
      - jabon
      - desinfectantes
      - cloro
      - detergentes
      - lavalozas
      - limpiador de pisos
      - limpiapisos
      - limpiavidrios
      - limpiador multiuso
      - quitagrasa
      - cera para pisos
      - desodorante ambiental
      - escobas
      - escobillon
      - traperos
      - mopas
      - panos de limpieza
      - panos multiuso
      - virutilla
      - bolsas de basura
      - bolsas de residuos
    palabras_candidatas:
      - insumos clinicos
      - material clinico
      - insumos hospitalarios
    # Frases de uso que se borran antes de evaluar: "Jeringa 3 ml para
    # administración de medicamentos" no es una compra de medicamentos.
    ignorar:
      - administracion de medicamentos
      - preparacion de medicamentos
      - dilucion de medicamentos
      - carro de medicamentos
    # Claves que nombran una categoría completa: en una OC de un solo ítem sin
    # palabra clave no bastan para clasificarlo por el nombre de la OC ("Compra de
    # insumos médicos" con un monitor o un despacho).
    palabras_amplias:
      - insumos medicos
      - articulos de aseo
      - art de aseo
      - materiales de aseo
      - productos de aseo
      - insumos de aseo
      - equipos de aseo
      - utiles de aseo
      - productos de limpieza
      - articulos de limpieza
      - insumos de limpieza
      - materiales de limpieza
    excluir_en_nombre:
      - farmacos
      - medicamentos
      - susp iny
      - suspension inyectable
      - solucion inyectable
      # Radiología (jeringas de inyector): dispositivo especializado
      - medio de contraste
      - agente de contraste
      - inyector de contraste
      # Servicios (personal de aseo), no venta de productos
      - servicio de aseo
      - serv de aseo
      - servs de aseo
      - servicio complementario de aseo
      - servicios externos de aseo
      - aseo integral
      - serv integral
      - provision de personal
      - servicio de limpieza
      - serv de limpieza
      - limpieza de fosas
      - fosas
      - alcantarillado
      - concesion
      - aseo y ornato
      # EPP industrial y agua potable: nunca son insumo médico, aunque digan "guantes"/"cloro"
      - soldador
      - soldar
      - tacticos
      - motorista
      - anticorte
      - anti corte
      - cabritilla
      - descarne
      - de cuero
      - zapatos de seguridad
      - ropa de trabajo
      - cascos
      - cuadrilla
      - agua potable
      - apr
      - sanitario rural
      - cloro gas
    # Claves genéricas que no alcanzan para anular una exclusión "salvo clave
    # específica": "EPP: guantes y lentes" se descarta; "EPP: guantes, mascarillas y
    # pecheras" no.
    no_rescatan:
      - guantes
      - cloro
    # Especialidades clínicas: suelen comprar dispositivos técnicos o de marca, no
    # productos de reventa. Si el nombre las menciona, sus claves genéricas
    # ("Insumos médicos para angiografía") no bastan: deciden los ítems (una línea
    # de guantes o gasas sí cuenta). Una clave dentro de la frase ("jeringa
    # inyectora") nunca cuenta.
    especialidades:
      - angiografia
      - hemodinamia
      - traumatologia
      - cardiocirugia
      - cirugia cardiaca
      - cirugia robotica
      - laparoscopia
      - dialisis
      - hemodialisis
      - oftalmologia
      - neurocirugia
      - vascular
      - urologia
      - endoscopia
      - radiologia
      - resonador
      - resonancia magnetica
      - jeringa inyectora
      - formalina
    # Claves que nombran un tipo de producto sin decir cuál (puede ser regulado o
    # no): en especialidades no bastan, y para "solo regulados" mandan las líneas.
    claves_genericas:
      - insumos medicos
      - guantes
      - jeringas
      - mascarillas
      - cloro
    excluir_en_nombre_salvo_clave_especifica:
      # EPP de soldadura ("bolsas con soldadura estrella" sí se revisan)
      - guantes de soldadura
      - guantes para soldadura
      - trabajos de soldadura
      # Cloro para tratamiento de agua o de laboratorio (no es producto de aseo)
      - tratamiento de agua
      - planta de tratamiento
      - agua rural
      - agua de bebida
      - potabilizacion
      - analizador de cloro
      - medidor de cloro
      - cloro residual
      - cloro libre y total
      # Guantes de EPP industrial (si el nombre trae además otra clave, p. ej.
      # "guantes de nitrilo" o "mascarillas", se revisa igual)
      - guantes de seguridad
      - guantes de trabajo
      - guantes de jardineria
      - proteccion personal
      - epp
      - implementos de seguridad
      - elementos de seguridad
      - lentes de seguridad
    excluir_en_nombre_salvo_clave:
      # Recolección de basura (servicio), salvo que se compren bolsas, etc.
      - recoleccion
      - residuos
      # Mascarillas que son dispositivos de terapia, no insumo de reventa
      - mascarillas laringeas
      - mascarillas de nebulizacion
      - mascarillas nebulizador
      - mascarillas de anestesia
      - mascarillas anestesia
      - aerocamara
      # Insumos clínicos especializados (normalmente dispositivos regulados).
      - cateteres
      - sondas
      - endotraqueal
      - endotqq
      - tuboendotqq
      - accesos venosos
      - suturas quirurgicas
      - parches dea
      - stents
      - angioplastia
      - implantes
      - protesis
      - marcapasos
      - osteosintesis
      - nebulizador

  consultoria_gestion_bi:
    nombre: "Consultoría en gestión, BI y control de gestión"
    # La descripción general suele nombrar unidades ("Depto. de Planificación
    # Estratégica y Control de Gestión"): para este rubro solo cuentan nombre e ítems.
    detectar_en_descripcion: false
    # La categoría/producto ONU "Servicios de consultoría de gestión" se usa para
    # casi cualquier servicio profesional (médicos, abogados…): no cuenta.
    usar_clasificacion_onu: false
    palabras_clave:
      - consultoria en gestion
      - consultoria para la gestion
      - asesoria en gestion
      - gestion estrategica
      - modelo de gestion
      - gestion de procesos
      - mejora de procesos
      - mejoramiento de procesos
      - levantamiento de procesos
      - rediseno de procesos
      - plan estrategico
      - inteligencia de negocios
      - business intelligence
      - servicios bi
      - solucion bi
      - plataforma bi
      - power bi
      - microstrategy
      - tableau
      - qlik
      - dashboard
      - tablero de control de gestion
      - tablero de gestion
      - tablero de indicadores
      - cuadro de mando
      - sistema de indicadores
      - indicadores de desempeno
      - kpi
      - analisis de datos
      - analitica de datos
      - visualizacion de datos
      - ciencia de datos
      - arquitectura de datos
      - arquitectura de informacion
      - arquitectura empresarial
      - arquitectura de procesos
      - gestion financiera
      - control presupuestario
      - control financiero
      - modelo de costos
      - estudio de costos
      - reportabilidad
    # Débiles: también son nombres de unidades o frases de informes ("reporte con
    # indicadores de gestión"). Cuentan en el nombre; en ítems, solo junto a otra clave.
    palabras_debiles:
      - tablero de control
      - control de gestion
      - planificacion estrategica
      - indicadores de gestion
    palabras_candidatas:
      - consultoria
      - asesoria
      - servicios profesionales
    # Órdenes de compra. El producto de cada ítem suele ser el nombre ONU:
    #   productos_genericos: productos ONU que se usan para cualquier servicio
    #     profesional; no cuentan por sí solos (se mira la especificación).
    #   especificacion_si_producto: si el producto no trae palabra clave, la
    #     especificación del comprador solo se revisa en estos productos ("Servicios
    #     de catering" para una "jornada de plan estratégico" no es consultoría).
    productos_genericos:
      - servicios de consultoria de gestion
      - servicios de asesoria de gestion
      - consultoria de gestion
      - asesoria de gestion
    especificacion_si_producto:
      - consultoria
      - asesoria
      - servicios profesionales
      - apoyo gerencial
      - software
      - licencias
      - sistemas de informacion
      - servicios informaticos
      - plataforma
      - capacitacion
      - formacion
      - cursos
      - diplomado
      - estudios
    ignorar:
      - direccion de obras
      - direccion de obras municipales
      - direccion de obras hidraulicas
      - direccion de obras portuarias
      - direccion general de obras publicas
      - ministerio de obras publicas
    excluir_en_nombre:
      - asesoria juridica
      - asesoria legal
      - consultoria juridica
      - inspeccion tecnica
      - inspeccion fiscal
      - pavimentacion
      - repavimentacion
    excluir_en_nombre_salvo_clave:
      # "Tablero de control" también es un tablero eléctrico.
      - tablero de control electrico
      - tablero electrico
      - tablero de fuerza
      # Construcción e ingeniería (salvo que el nombre traiga gestión/BI).
      - obras
      - obras civiles
      - construccion
      - arquitectura
      - ingenieria civil
      - impacto ambiental

# Alertas regulatorias (ISP / Minsal). No excluyen nada: agregan las columnas
# "alertas_regulatorias" y "solo_regulados" (= todo lo detectado es producto con
# registro obligatorio), para filtrar en Power BI. "excepto": frases que se borran
# antes de revisar (p. ej. "libre de látex" no es un guante de látex).
# Fuente: investigación del 12-10-2026 con normativa del ISP, Minsal y BCN;
# confírmalo con el ISP antes de comprometer contratos.
alertas_regulatorias:
  - palabras: [guantes de latex, guante latex, latex, guantes quirurgicos, guantes esteriles]
    excepto: [libre de latex, libres de latex, sin latex, no latex, exento de latex, exentos de latex,
              libre de polvo y latex, libres de polvo y latex, sin polvo ni latex, polvo ni latex,
              latex free, pintura latex, pintura al latex, no contiene latex]
    # En guantes de nitrilo o vinilo, "sin"/"libre de"/"s/" hasta 3 palabras antes de
    # "látex" lo niega: "Guante nitrilo libre de polvo, látex".
    negada_si_contiene: [nitrilo, vinilo]
    nota: "Guantes de látex/quirúrgicos: registro ISP + conformidad por lote (DE 342/2004)"
  - palabras: [jeringas, agujas hipodermicas, agujas desechables, aguja de jeringa]
    nota: "Jeringas/agujas: registro ISP + conformidad por lote (DE 47/2025)"
  - palabras: [n95, n 95, kn95, kn 95, ffp2, ffp 2, ffp3, ffp 3, respirador n95, respiradores desechables,
               respirador desechable]
    nota: "Respiradores N95/KN95: EPP inscrito en el RFI del ISP (Res. 45/2023)"
  - palabras: [alcohol gel, clorogel, gel hidroalcoholico, gel hidro alcoholico, gel alcoholico,
               solucion hidroalcoholica, gel antiseptico, gel desinfectante, higienizante de manos]
    nota: "Alcohol gel: registro ISP como cosmético (Res. Minsal 199/2021)"
  - palabras: [desinfectantes, cloro, hipoclorito, amonio cuaternario, sanitizantes, toallas desinfectantes]
    excepto: [resistente a desinfectantes, compatible con desinfectantes, sin cloro, libre de cloro,
              libres de cloro, exento de cloro, blanqueado sin cloro, analizador de cloro,
              medidor de cloro, cloro residual, cloro libre y total]
    nota: "Desinfectantes/cloro: registro ISP 'D' (DS 157)"
  - palabras: [jabon liquido, jabon de manos, jabon antibacterial]
    nota: "Jabón de manos: producto de higiene con trámite ISP (DS 239/2002)"

# Licitaciones activas: solo se pide el detalle de las que pasan el
# filtro preliminar por nombre (ahorra llamadas). Con "false" se pide el
# detalle de todas (mucho más lento).
filtro_preliminar_por_nombre: true

rutas:
  base_datos: "data/radar.db"
  exportaciones: "data/exportaciones"
