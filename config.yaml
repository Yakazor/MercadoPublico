# Alertas regulatorias (ISP / Minsal). No excluyen nada: agregan la columna
# "alertas_regulatorias" y "solo_regulados" (= todas las palabras detectadas
# corresponden a productos con registro obligatorio), para filtrar en Power BI.
# Fuente: investigación del 12-10-2026 con normativa del ISP, Minsal y BCN;
# confírmalo con el ISP antes de comprometer contratos.
alertas_regulatorias:
  - palabras: [guantes de latex, guante de latex, latex, guantes quirurgicos, guante quirurgico, guantes esteriles]
    nota: "Guantes de látex/quirúrgicos: registro ISP + conformidad por lote (DE 342/2004)"
  - palabras: [jeringa, jeringas, aguja, agujas, aguja hipodermica, agujas hipodermicas]
    nota: "Jeringas/agujas: registro ISP + conformidad por lote (DE 47/2025)"
  - palabras: [n95, kn95, ffp2, respirador, respiradores]
    nota: "Respiradores N95/KN95: EPP inscrito en el RFI del ISP (Res. 45/2023)"
  - palabras: [alcohol gel, gel antiseptico, gel desinfectante, higienizante de manos]
    nota: "Alcohol gel: registro ISP como cosmético (Res. Minsal 199/2021)"
  - palabras: [desinfectante, desinfectantes, cloro, hipoclorito, amonio cuaternario, sanitizante, sanitizantes, toallas desinfectantes]
    nota: "Desinfectantes/cloro: registro ISP 'D' (DS 157)"
  - palabras: [jabon liquido, jabon de manos, jabon antibacterial]
    nota: "Jabón de manos: producto de higiene con trámite ISP (DS 239/2002)"

# Licitaciones activas: solo se pide el detalle de las que pasan el
# filtro preliminar por nombre (ahorra llamadas). Con "false" se pide el
# detalle de todas (mucho más lento).
filtro_preliminar_por_nombre: true

rutas:
  base_datos: "data/radar.db"
  exportaciones: "data/exportaciones"
