# Configuración del Radar de Licitaciones

api:
  base_url: "https://api.mercadopublico.cl/servicios/v1/publico"
  timeout_segundos: 30
  pausa_entre_llamadas_segundos: 2.0   # respeta el límite de la API
  reintentos: 4                        # esperas crecientes: 2, 4, 8, 16 s
  espera_inicial_reintento_segundos: 2

# Compras Ágiles (API Compra Ágil v2, api2.mercadopublico.cl): las abiertas a
# cotización que calzan con tus rubros se suman al dashboard como tipo "Compra Ágil".
# Usa el secreto MP_TICKET_COMPRA_AGIL si existe; si no, MP_TICKET.
compra_agil:
  activo: true
  # ¿Mercado Público te clasifica como Empresa de Menor Tamaño (EMT)? Lo dice tu ficha de
  # proveedor (Idoneidad). Sin EMT solo puedes cotizar en el 2º llamado: las de 1er llamado no se
  # cotizan en la rutina y la plataforma muestra de partida solo las de 2º llamado.
  soy_emt: false
  # Regiones del organismo comprador (1 a 16; 13 = Metropolitana, 5 = Valparaíso,
  # 6 = O'Higgins). Vacío = todo Chile (en el dashboard se filtra por región).
  regiones: []
  # El workflow «Compras Ágiles» corre cada 3 horas y lista solo lo publicado desde la
  # corrida anterior (la API entrega ~10 compras cada ~5 s). La primera vez, o si la
  # memoria se pierde, parte con los últimos `dias_iniciales` días.
  dias_iniciales: 3
  tamano_pagina: 10           # con más, la API suele responder HTTP 504
  max_paginas: 400            # por corrida
  max_detalles: 700           # por corrida; primero las publicadas más recientemente
  # Duran 1 o 2 días: no se revisan las que cierran antes de este plazo (no alcanzan a cotizarse).
  margen_cotizar_horas: 12
  pausa_entre_llamadas_segundos: 4.0   # desde el inicio de la consulta anterior (~15 por minuto)
  reintentos: 3
  espera_inicial_reintento_segundos: 5
  max_espera_429_segundos: 900
  timeout_segundos: 60

# Rubros a detectar. Cómo se comparan las frases:
#   - sin tildes, mayúsculas ni puntuación ("SERV.ASEO" = "serv aseo");
#   - cada palabra admite plural ("guante" = "guantes"): basta escribir una forma;
#   - entre palabras se admiten conectores ("productos de aseo" = "productos aseo"
#     = "productos para el aseo");
#   - siempre por palabra completa ("aseo" no coincide con "paseo").
#
#   palabras_clave:      cuenta como detección si aparece en el NOMBRE o en los ÍTEMS
#                        (y en la descripción general si detectar_en_descripcion: true;
#                        en la categoría ONU de los ítems si usar_clasificacion_onu: true).
#   palabras_debiles:    claves que cuentan en el NOMBRE, pero en los ítems solo junto
#                        a otra clave (también son nombres de unidades o frases de informes).
#   no_rescatan:         claves genéricas ("guantes") que no anulan una exclusión
#                        "salvo clave específica" (p. ej. "epp").
#   palabras_candidatas: frases amplias que, en el NOMBRE, hacen que se revise el
#                        detalle; por sí solas NO cuentan como detección (en rubros sin
#                        detectar_en_descripcion, la descripción cuenta si trae 2+ claves).
#   excluir_en_nombre:   descarta SIEMPRE si aparece en el nombre (servicios, obras).
#   excluir_en_nombre_salvo_clave: descarta si aparece en el nombre, SALVO que el
#                        nombre traiga otra palabra clave fuera de la frase excluida:
#                        "Mascarilla laríngea desechable" → se descarta;
#                        "Mascarillas laríngeas, guantes y gasas" → se revisa por guantes.
#                        Una palabra clave dentro de la frase excluida no cuenta.
#   excluir_en_nombre_salvo_clave_especifica: igual, pero las claves de `no_rescatan`
#                        no bastan: "EPP: guantes y lentes" → se descarta.
#   (Las exclusiones también se revisan en cada ítem.)
#   ignorar:             frases que se borran antes de evaluar (nombres de unidades
#                        compradoras). Los nombres de unidad seguidos de una palabra
#                        clave ("Departamento de Control de Gestión") se ignoran solos.
#   excluir_grupos:      listas de `grupos_exclusion` que se suman a excluir_en_nombre.
#                        También se buscan en el producto ONU de cada línea: si TODAS
#                        son del grupo ("Sondas quirúrgicas", "Servicios de catering"),
#                        la compra no es del rubro aunque el nombre diga "balón".
# En las órdenes de compra se clasifica CADA ÍTEM por su producto/categoría: solo
# se guardan (y entran al cálculo de precios) los ítems de tus rubros.
# Exclusiones compartidas por varios rubros (se usan con `excluir_grupos`).
grupos_exclusion:
  # Productos clínicos que se llaman como uno de reventa: clavos y tornillos de
  # traumatología, balones de angioplastia, lavadoras de esterilización, paquetes de
  # ropa estéril, monitores de oximetría. Los de reventa los descartan; los insumos
  # médicos se detectan en su propio rubro.
  clinico:
    - insumos clinicos
    - insumos medicos
    - insumos medico quirurgicos
    - quirurgico
    - quirurgica
    - cirugia
    - cardiocirugia
    - traumatologia
    - osteosintesis
    - intramedular
    - artrodesis
    - canulados
    - tmt
    - tibio
    - tibial
    - calcaneo
    - femoral
    - hemodinamia
    - angiografia
    - angioplastia
    - cateteres
    - stents
    - dilatacion
    - endoprotesis
    - endop
    - medicados
    - esteril
    - esterilizacion
    - consignacion
    - comodato
    - dialisis
    - oximetria
    - monitorizacion
    - farmacos
    - medicamentos
    - insulina
    - dosis unitaria
    - anestesia
    - biopsia
    - cinta adhesiva medica
    - venoso
    - protesica
    - protesis
    - cuidados intensivos
    - paciente
    - enfermo
    - posicionar
    - respiracion
    - oxigeno
    - infusion
    - restriccion
    - glucosa
    - colesterol
    - medio de contraste
    - medios de contraste
    - meglumina
    - ventilados
    - ventilacion mecanica
    - rayos x
    - rx
    - semaglutida
    - semaglutide
    - liraglutida
    - dulaglutida
    - tirzepatida
    - cortinas clinicas
    - traqueostomia
    - traqueotomia
    - marcapasos
    # Vistos en Compras Ágiles: trocar ("camisa reductor"), sonda Foley ("balón de
    # 5 cc"), holder Vacutainer ("camisas"), sensor de saturación ("monitor"),
    # balón de corte coronario, ionómero de vidrio dental, test de parche.
    - trocar
    - foley
    - vacutainer
    - sensor de saturacion
    - balon de corte
    - coronario
    - coronaria
    - ionomero
    - dental
    - test de parche
    - cardioquirurgico
    - cardioquirurgica

  # Servicios que llegan como ítem único de una OC cuyo nombre trae un producto.
  servicios:
    - desarrollo de plataforma
    - plataforma web
    - desarrollo web
    - bodegaje
    - instalacion de cortinas
    - inst de cortinas
    - serv mant
    - mant preventivo
    - mant correctivo
    - mantenimiento preventivo
    - mantenimiento correctivo
    - preventivo y correctivo
    # Tarjetas de regalo del retail (no son productos) y servicios de alimentación
    - gift card
    - gif card
    - giftcard
    - cocteleria
    - catering

