# Configuración del Radar de Licitaciones

api:
  base_url: "https://api.mercadopublico.cl/servicios/v1/publico"
  timeout_segundos: 30
  pausa_entre_llamadas_segundos: 2.0   # respeta el límite de la API
  reintentos: 4                        # esperas crecientes: 2, 4, 8, 16 s
  espera_inicial_reintento_segundos: 2

# Rubros a detectar. Las palabras se comparan sin tildes ni mayúsculas y por
# palabra completa ("aseo" no coincide con "paseo"). Escribe singular Y plural
# ("guante", "guantes") y prefiere frases ("articulos de aseo") a palabras
# sueltas ("aseo"), que traen muchos falsos positivos.
#
#   palabras_clave:      cuenta como detección si aparece en el NOMBRE o en los
#                        ÍTEMS. En la descripción general solo suma (ahí suelen
#                        nombrarse unidades como "Depto. de Control de Gestión").
#   palabras_candidatas: frases amplias que, en el NOMBRE, hacen que se revise el
#                        detalle; por sí solas NO cuentan como detección.
#   excluir_en_nombre:   descarta SIEMPRE si aparece en el nombre (servicios, EPP
#                        industrial, obras).
#   excluir_en_nombre_salvo_clave: descarta si aparece en el nombre, SALVO que el
#                        nombre también traiga una palabra clave. Ej.: "sondas"
#                        descarta "Compra de sondas", pero no "Gasas, guantes y
#                        sondas"; "residuos" no descarta "Bolsas de basura para
#                        residuos".
# En las órdenes de compra se aplica lo mismo a CADA ÍTEM por separado: solo se
# guardan (y entran al cálculo de precios) los ítems de tus rubros.
rubros:
  insumos_medicos_aseo:
    nombre: "Insumos médicos no regulados y aseo"
    palabras_clave:
      # Insumos médicos de uso general
      - insumos medicos
      - insumo medico
      - guante
      - guantes
      - guantes de nitrilo
      - guantes de latex
      - guantes de procedimiento
      - mascarilla
      - mascarillas
      - respirador desechable
      - respiradores desechables
      - pechera
      - pecheras
      - cofia
      - cofias
      - jeringa
      - jeringas
      - gasa
      - gasas
      - aposito
      - apositos
      - alcohol gel
      - toallas desinfectantes
      # Productos de aseo (frases, no la palabra "aseo" sola)
      - articulo de aseo
      - articulos de aseo
      - articulos aseo
      - art. de aseo
      - art. aseo
      - arts. de aseo
      - material de aseo
      - materiales de aseo
      - materiales aseo
      - producto de aseo
      - productos de aseo
      - productos aseo
      - insumos de aseo
      - insumos aseo
      - insumos para aseo
      - equipos de aseo
      - utiles de aseo
      - utiles aseo
      - productos de limpieza
      - articulos de limpieza
      - insumos de limpieza
      - materiales de limpieza
      - toalla de papel
      - toallas de papel
      - papel higienico
      - jabon liquido
      - desinfectante
      - desinfectantes
      - cloro
      - detergente
      - detergentes
      - bolsa de basura
      - bolsas de basura
    palabras_candidatas:
      - insumos clinicos
      - insumo clinico
      - material clinico
      - materiales clinicos
      - insumos hospitalarios
    excluir_en_nombre:
      - farmaco
      - farmacos
      - medicamento
      - medicamentos
      # Servicios (personal de aseo), no venta de productos
      - servicio de aseo
      - servicios de aseo
      - servicio aseo
      - servicios aseo
      - serv aseo
      - serv. aseo
      - serv. de aseo
      - servicio complementario de aseo
      - servicios externos de aseo
      - aseo integral
      - serv integral
      - serv. integral
      - serv.integral
